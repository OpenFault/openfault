{% extends "auth.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<h1>Sign in</h1>
{% if let Some(e) = error %}<p class="error">{{ e }}</p>{% endif %}
<form method="post" action="/login" class="stack">
  <label>Email <input name="email" type="email" value="{{ email }}" required autocomplete="email"{% if email.is_empty() %} autofocus{% endif %}></label>
  <label>Password <input name="password" type="password" required autocomplete="current-password"{% if !email.is_empty() %} autofocus{% endif %}></label>
  <button>Sign in</button>
</form>
<p class="sm" style="margin-top:16px"><a class="muted" href="/forgot">Forgot password?</a></p>
{% endblock %}
