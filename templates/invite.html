{% extends "auth.html" %}
{% block title %}Join{% endblock %}
{% block content %}
<h1>Join OpenFault</h1>
<p class="muted">You were invited as {{ email }}.</p>
{% if let Some(e) = error %}<p class="error">{{ e }}</p>{% endif %}
<form method="post" action="/invite/{{ token }}" class="stack">
  <label>Your name <input name="name" required autofocus></label>
  <label>Password <input name="password" type="password" minlength="10" required autocomplete="new-password"></label>
  <button>Join</button>
</form>
{% endblock %}
