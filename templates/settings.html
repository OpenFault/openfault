{% extends "app.html" %}
{% block title %}Settings{% endblock %}
{% block content %}
<h1>Settings</h1>
{% include "settings_nav.html" %}
<form method="post" action="/settings" class="stack">
  <label>Organization name <input name="name" value="{{ org_name }}" required></label>
  <button>Save</button>
</form>
<dl class="kv">
  <dt>Base URL</dt><dd><code>{{ base_url }}</code> <span class="muted">(OPENFAULT_BASE_URL)</span></dd>
  <dt>Email</dt><dd>{% if smtp %}SMTP configured{% else %}<span class="muted">SMTP not configured (OPENFAULT_SMTP_URL)</span>{% endif %}</dd>
</dl>
{% endblock %}
