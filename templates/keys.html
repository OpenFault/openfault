<dialog id="help" aria-label="Keyboard shortcuts">
  <h3 style="margin:0">Keyboard shortcuts</h3>
  <dl>
    <dt><kbd>j</kbd> <kbd>k</kbd></dt><dd>Move down / up</dd>
    <dt><kbd>enter</kbd></dt><dd>Open issue</dd>
    <dt><kbd>x</kbd></dt><dd>Select issue</dd>
    <dt><kbd>r</kbd></dt><dd>Resolve</dd>
    <dt><kbd>m</kbd></dt><dd>Mute</dd>
    <dt><kbd>a</kbd></dt><dd>Approve for fix</dd>
    <dt><kbd>/</kbd> <kbd>&#8984;K</kbd></dt><dd>Search</dd>
    <dt><kbd>?</kbd></dt><dd>This help</dd>
  </dl>
  <form method="dialog"><button class="secondary sm">Close</button></form>
</dialog>
