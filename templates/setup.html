{% extends "auth.html" %}
{% block title %}Setup{% endblock %}
{% block content %}
<h1>Set up OpenFault</h1>
<p class="muted">Create your organization, your owner account and your first project.</p>
{% if let Some(e) = error %}<p class="error">{{ e }}</p>{% endif %}
<form method="post" action="/setup" class="stack">
  <label>Organization name <input name="org_name" required></label>
  <label>Your name <input name="name" required></label>
  <label>Email <input name="email" type="email" required autocomplete="email"></label>
  <label>Password <input name="password" type="password" minlength="10" required autocomplete="new-password"><span class="hint">At least 10 characters.</span></label>
  <label>First project <input name="project_name" required></label>
  <label>Platform <select name="platform">{% let current = "" %}{% include "platforms.html" %}</select></label>
  <button>Create</button>
</form>
{% endblock %}
