{% extends "auth.html" %}
{% block title %}New password{% endblock %}
{% block content %}
<h1>Choose a new password</h1>
{% if let Some(e) = error %}<p class="error">{{ e }}</p>{% endif %}
<form method="post" action="/reset/{{ token }}" class="stack">
  <label>New password <input name="password" type="password" minlength="10" required autocomplete="new-password"><span class="hint">At least 10 characters.</span></label>
  <button>Save and sign in</button>
</form>
{% endblock %}
