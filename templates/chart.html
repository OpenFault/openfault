{% if c.kind == "area" %}<div class="ch area" style="--h:{{ c.h }}px;--x:{{ "{:.2}"|format(c.x) }}%;--y:{{ "{:.2}"|format(c.y) }}%" role="img" aria-label="{{ c.label }}"><svg viewBox="0 0 100 {{ c.h }}" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="g{{ c.id }}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="currentColor" stop-opacity=".18"/><stop offset="1" stop-color="currentColor" stop-opacity="0"/></linearGradient></defs><path d="{{ c.d }}" fill="url(#g{{ c.id }})"/></svg></div>{% else %}<div class="ch bars{% if !c.tips %} s{% endif %}" style="--h:{{ c.h }}px" role="img" aria-label="{{ c.label }}">{% for b in c.bars %}<i style="--v:{{ "{:.1}"|format(b.h) }}%"{% if b.v == 0 %} class="z"{% endif %}{% if c.tips %} data-tip="{{ b.tip }}"{% endif %}></i>{% endfor %}</div>{% endif %}
