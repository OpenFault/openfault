services:
  openfault:
    image: ghcr.io/openfault/openfault:latest
    ports:
      - "8080:8080"
    volumes:
      - openfault-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/openfault", "healthcheck"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    # environment:
    #   OPENFAULT_BASE_URL: https://errors.example.com

volumes:
  openfault-data:
